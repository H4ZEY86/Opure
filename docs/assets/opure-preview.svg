<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <style><![CDATA[
      .title { fill: #ffffff; font-family: Inter, Roboto, Arial, sans-serif; font-weight: 700; font-size: 42px; }
      .subtitle { fill: #9CA3AF; font-family: Inter, Roboto, Arial, sans-serif; font-size: 18px; }
      .chip { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.06); }
      .ui { fill: #071020; stroke: rgba(255,255,255,0.03); }
      .accent { fill: #ff7a18; }
      .small { fill: #cbd5e1; font-size: 13px; font-family: Inter, Roboto, Arial, sans-serif; }
    ]]></style>
  </defs>

  <rect width="1200" height="420" rx="8" fill="url(#g1)" />

  <!-- left panel: UI mock -->
  <g transform="translate(48,48)" filter="url(#f1)">
    <rect width="560" height="324" rx="12" class="ui" />
    <!-- header -->
    <rect x="16" y="16" width="220" height="20" rx="6" class="chip" />
    <rect x="16" y="44" width="120" height="12" rx="6" class="chip" />

    <!-- columns -->
    <rect x="16" y="72" width="150" height="220" rx="8" fill="#0b1220" />
    <rect x="184" y="72" width="360" height="220" rx="8" fill="#07102a" />

    <!-- lines in right column -->
    <g fill="#0f172a">
      <rect x="200" y="84" width="320" height="12" rx="6" />
      <rect x="200" y="106" width="260" height="10" rx="6" />
      <rect x="200" y="126" width="200" height="10" rx="6" />
      <rect x="200" y="146" width="160" height="10" rx="6" />
      <rect x="200" y="170" width="280" height="10" rx="6" />
      <rect x="200" y="192" width="320" height="10" rx="6" />
    </g>

    <!-- waveform / audio preview -->
    <g transform="translate(36,280)">
      <rect width="488" height="28" rx="6" fill="#041023" />
      <path d="M4 14 C 40 6, 80 22, 120 14 C 160 6, 200 22, 240 14 C 280 6, 320 22, 360 14 C 400 6, 440 22, 484 14"
            stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- right panel: text -->
  <g transform="translate(640,80)">
    <text x="0" y="0" class="title">Opure</text>
    <text x="0" y="44" class="subtitle">Developer Respect · Local Intelligence · Complete Control</text>

    <g transform="translate(0,88)">
      <rect x="0" y="0" width="112" height="28" rx="6" class="chip" />
      <text x="12" y="19" class="small">Preview release</text>

      <rect x="132" y="0" width="120" height="28" rx="6" class="chip" />
      <text x="144" y="19" class="small">Local‑first</text>

      <rect x="264" y="0" width="120" height="28" rx="6" class="chip" />
      <text x="276" y="19" class="small">Dev‑first</text>
    </g>

    <text x="0" y="150" class="small">Opure is a local-first software engineering platform that helps developers inspect, plan, build, test, and apply reviewable patches while keeping them in control of privacy, providers and flow.</text>

    <!-- CTA button-like -->
    <a href="https://h4zey86.github.io/Opure/">
      <rect x="0" y="196" width="220" height="44" rx="8" fill="#111827" stroke="#1f2937" />
      <text x="24" y="228" fill="#ffffff" font-family="Inter, Roboto, Arial, sans-serif" font-size="16">Open demo · Opure</text>
    </a>

    <!-- accent dots -->
    <circle cx="320" cy="220" r="5" class="accent" />
    <circle cx="340" cy="220" r="5" fill="#06b6d4" />
  </g>

  <!-- footer small text -->
  <text x="48" y="400" fill="#94a3b8" font-family="Inter, Roboto, Arial, sans-serif" font-size="12">Built with C# · .NET 10 · Avalonia · Local-first · Developer-first</text>
</svg>
