syntax = "proto3";

package opure.trust.project.v1;

import "overview/trust_overview.proto"; // for enums like TrustEvidenceReleaseChannel, TrustEvidenceQueryDisposition, TrustEvidenceOwnerAvailability, TrustEvidenceQueryCompleteness, EvidenceAuthorityClass

option csharp_namespace = "Opure.TrustEvidence.Protocol.Project.V1";

service TrustProjectService {
  rpc QueryProject(TrustProjectRequestMessage) returns (TrustProjectResponseMessage);
}

message TrustProjectRequestMessage {
  uint32 contract_revision = 1;
  string query_id = 2;
  opure.trust.overview.v1.TrustEvidenceReleaseChannel release_channel = 3;
  string project_id = 4;
  int64 from_unix_time_milliseconds = 5;
  int64 to_unix_time_milliseconds = 6;
}

message TrustProjectResponseMessage {
  uint32 contract_revision = 1;
  opure.trust.overview.v1.TrustEvidenceQueryDisposition disposition = 2;
  TrustProjectSnapshotMessage snapshot = 3;
  string stable_code = 4;
  string safe_detail = 5;
}

message TrustProjectSnapshotMessage {
  string query_id = 1;
  string project_id = 2;
  string safe_root_class = 3;
  int64 calculated_at_unix_time_milliseconds = 4;
  string projection_generation = 5;
  int64 projection_updated_at_unix_time_milliseconds = 6;
  opure.trust.overview.v1.TrustEvidenceOwnerAvailability owner_availability = 7;
  opure.trust.overview.v1.TrustEvidenceQueryCompleteness completeness = 8;
  string effective_filters_sha256 = 9;
  string current_workspace_generation = 10;
  repeated TrustProjectTimelineEventMessage events = 11;
}

message TrustProjectTimelineEventMessage {
  string evidence_id = 1;
  string evidence_type_id = 2;
  string owner_service_id = 3;
  opure.trust.overview.v1.EvidenceAuthorityClass authority_class = 4;
  string operation_id = 5;
  string parent_operation_id = 6;
  string action = 7;
  string outcome = 8;
  int64 occurred_at_unix_time_milliseconds = 9;
  int64 observed_at_unix_time_milliseconds = 10;
  string record_sha256 = 11;
  string normalised_path = 12;
}
